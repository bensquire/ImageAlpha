name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Lint
        run: make lint

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build pngquant
        run: make pngquant

      - name: Build release
        run: make release

      - name: Run tests
        run: make test
